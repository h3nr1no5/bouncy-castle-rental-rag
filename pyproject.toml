[project]
name = "llm-zoomcamp-rag"
version = "0.1.0"
description = "Bouncy Castle Rental FAQ RAG Agent"
requires-python = ">=3.11"
dependencies = [
    "dlt[duckdb]>=1.29.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.4",
    "faiss-cpu>=1.10",
    "groq>=0.18",
    "openai>=1.68",
    "psycopg2-binary>=2.9",
    "tqdm>=4.67",
    "pydantic>=2.11",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ipykernel>=6.29",
    "notebook>=7.0",
    "python-dotenv>=1.0",
]
