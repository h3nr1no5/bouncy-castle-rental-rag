apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: postgres
    type: postgres
    url: $POSTGRES_HOST:$POSTGRES_PORT
    database: $POSTGRES_DB
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: $POSTGRES_SSLMODE
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
